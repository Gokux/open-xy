name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  private-data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_private_files.py --tree HEAD
      - run: python tools/check_private_files.py --history
  source-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy==2.3.5
      - run: python sdk.py check
  first-machine:
    # The first-machine walkthrough end to end: scaffold, C++/Wasm preview,
    # stale-source rejection and the documented audible edit. No firmware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: python -m pip install numpy==2.3.5
      - run: python tools/check_first_machine.py --cxx clang++
  open-xy-web:
    runs-on: ubuntu-latest
    env:
      OPEN_XY_KIT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run build
