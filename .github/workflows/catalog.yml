name: Catalog
# A catalog or SDK change fetches every published machine at its pinned commit
# and checks it as its own repository's CI does, then compiles the firmware
# module with the bundled machines and all of them. No stock files or device.
on:
  pull_request:
    # Adding or removing the controls-changed label runs the check again.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ['catalog/**', 'sdk/**', 'tooling/**', 'linker/**', 'profiles/**', 'machines/**', 'sdk.py',
            '.github/workflows/catalog.yml']
  push:
    branches: [main, staging]
    paths: ['catalog/**', 'sdk/**', 'tooling/**', 'linker/**', 'profiles/**', 'machines/**', 'sdk.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host test tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: A machine submission changes only the catalog
        # Machines live in their own repositories: a pull request from a fork that
        # touches the catalog may change nothing else. SDK changes are their own PR.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE: ${{ github.base_ref }}
        shell: bash
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if grep -qx 'catalog/machines.json' <<<"$changed" && [ "$changed" != 'catalog/machines.json' ]; then
            echo "::error::A machine submission changes only catalog/machines.json. Changed: $(echo $changed)"
            echo "Keep the machine in its own repository; open SDK changes as a separate pull request."
            exit 1
          fi
      - name: Catalog entries
        env:
          BASE: ${{ github.base_ref }}
          CONTROLS: ${{ contains(github.event.pull_request.labels.*.name, 'controls-changed') && '--allow-control-changes' || '' }}
        shell: bash
        # A pull request keeps every machine's ID and kind from its target branch, and a moved
        # release keeps its controls unless a catalog maintainer labels it controls-changed.
        run: python sdk.py catalog check ${BASE:+--base origin/$BASE} $CONTROLS
      - name: Fetch the pinned machines, confirming their tags, and check them
        run: python sdk.py catalog test --tags --cxx clang++ --host-cxx g++
  firmware:
    # The pinned Blackfin tools run on Windows x86_64 and macOS arm64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python sdk.py toolchain fetch
      - name: Fetch the pinned machines
        run: python sdk.py catalog fetch
      - name: Firmware compile with every bundled and published machine
        run: python sdk.py compile --collection local/catalog/collection.json --out ${{ runner.temp }}/module
